[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-flood-agent"
version = "0.3.0"
description = "Flood / water inundation screening agent: Copernicus HAND, JRC water mask, optional LLM tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "shapely>=2.0.0",
  "python-dotenv>=1.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "rasterio>=1.3.0",
]

[project.scripts]
geo-flood-agent = "geo_flood_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
